<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐 / 视频 · 设置</title>
<style>
:root{--bg:#14111a;--card:#1d1926;--line:#2e2739;--text:#ece8f2;--dim:#a89fb8;--pink:#DDAACC;--ok:#7ed6a5;--warn:#f0b26b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.sub a{color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.row:last-child{border-bottom:0}
.row label{flex:1}
.hint{color:var(--dim);font-size:12px;margin-top:2px}
input[type=number],input[type=text]{background:#120f17;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;width:110px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
button{background:var(--pink);color:#231a26;border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tag{background:#2a2233;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.tag b{color:var(--pink);font-weight:600}
.tag button{background:none;border:0;color:var(--dim);padding:0;cursor:pointer;font-size:14px}
.bar{display:flex;gap:10px;align-items:center}
#msg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a2233;border:1px solid var(--line);padding:8px 16px;border-radius:10px;opacity:0;transition:.2s;font-size:13px}
#msg.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>音乐 / 视频</h1>
  <div class="sub">保存后立即生效，不用重启。返回 <a href="/console" id="back">控制台</a>。<span id="navLinks"></span></div>

  <div class="card">
    <h2>音乐</h2>
    <div class="row"><label>启用音乐语音<div class="hint">关掉后搜歌、推荐、解析全部停用</div></label><input type="checkbox" id="musicEnabled"></div>
    <div class="row"><label>自动解析卡片 / 链接<div class="hint">群里发 QQ 音乐、网易云的卡片或链接时自动转成 MP3 语音</div></label><input type="checkbox" id="autoParseCards"></div>
    <div class="row"><label>单条最长秒数<div class="hint">默认 300 秒（5 分钟）</div></label><input type="number" id="maxSeconds" min="5" max="3600"></div>
    <div class="row"><label>推荐时随机取几个喜好词条</label><input type="number" id="recommendTags" min="1" max="10"></div>
  </div>

  <div class="card">
    <h2>B 站视频转 MP4</h2>
    <div class="row"><label>通过 bili 插件发视频时自动转 MP4 发群<div class="hint">只处理插件自己发的视频，不解析群里出现的链接/卡片</div></label><input type="checkbox" id="mp4Enabled"></div>
    <div class="row"><label>超过多少分钟不转<div class="hint">默认 10 分钟</div></label><input type="number" id="maxDurationMinutes" min="1" max="120"></div>
    <div class="row"><label>以群文件形式发送<div class="hint">默认关：直接以 QQ 视频消息发出；勾上才作为群文件上传</div></label><input type="checkbox" id="sendAsFile"></div>
  </div>

  <div class="card">
    <h2>缓存</h2>
    <div class="row"><label>最多保留天数</label><input type="number" id="cacheDays" min="1" max="365"></div>
    <div class="row"><label>最多占用 MB</label><input type="number" id="cacheMaxMb" min="50" max="102400"></div>
    <div class="row"><label>当前占用<div class="hint" id="cacheNow">—</div></label><button class="ghost" id="cleanBtn">立即清理</button></div>
  </div>

  <div class="card">
    <h2>喜好词条</h2>
    <div class="hint">从你平时让我搜的歌里自动积累（主要取歌手和曲风）。推荐时会随机挑几个去搜。</div>
    <div class="tags" id="tags"></div>
    <div class="bar"><input type="text" id="newTag" placeholder="手动加一个词条" style="width:220px"><button class="ghost" id="addTag">添加</button></div>
  </div>

  <div class="bar"><button id="saveBtn">保存</button><span class="hint">改完记得点保存</span></div>
</div>
<div id="msg"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
document.getElementById('navLinks').innerHTML = ' · <a href="/bili?token=' + encodeURIComponent(token) + '">B 站设置 ↗</a> · <a href="/tts?token=' + encodeURIComponent(token) + '">语音设置 ↗</a>';
document.getElementById('back').href = '/console?token=' + encodeURIComponent(token);
const $ = (id) => document.getElementById(id);
let tags = [];
function toast(text, ok) {
  const el = $('msg'); el.textContent = text; el.style.borderColor = ok === false ? '#7a4b4b' : '#2e2739'; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
async function api(path, opts = {}) {
  const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || ('HTTP ' + res.status));
  return body;
}
function renderTags() {
  const box = $('tags');
  if (!tags.length) { box.innerHTML = '<span class="hint">还没有词条，搜几首歌就有了。</span>'; return; }
  box.innerHTML = tags.map((t, i) => '<span class="tag"><b>' + esc(t.kw) + '</b>' + (t.count > 1 ? '×' + t.count : '') + '<button data-i="' + i + '">×</button></span>').join('');
  box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { tags.splice(Number(b.dataset.i), 1); renderTags(); }));
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtBytes(n) { return n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
async function load() {
  const body = await api('/api/music/settings');
  const s = body.settings;
  $('musicEnabled').checked = s.music.enabled;
  $('autoParseCards').checked = s.music.autoParseCards;
  $('maxSeconds').value = s.music.maxSeconds;
  $('recommendTags').value = s.music.recommendTags;
  $('mp4Enabled').checked = s.mp4.enabled;
  $('maxDurationMinutes').value = s.mp4.maxDurationMinutes;
  $('sendAsFile').checked = s.mp4.sendAsFile;
  $('cacheDays').value = s.cache.days;
  $('cacheMaxMb').value = s.cache.maxMb;
  $('cacheNow').textContent = s.cache.stats.files + ' 个文件 · ' + fmtBytes(s.cache.stats.bytes);
  tags = Array.isArray(s.tags) ? s.tags : [];
  renderTags();
}
$('addTag').addEventListener('click', () => {
  const kw = $('newTag').value.trim();
  if (!kw) return;
  if (!tags.some((t) => t.kw === kw)) tags.unshift({ kw, count: 1 });
  $('newTag').value = '';
  renderTags();
});
$('cleanBtn').addEventListener('click', async () => {
  try { const r = await api('/api/music/clean', { method: 'POST', body: '{}' }); toast('清掉了 ' + r.result.removed + ' 个文件'); await load(); }
  catch (e) { toast('清理失败：' + e.message, false); }
});
$('saveBtn').addEventListener('click', async () => {
  const payload = {
    music: { enabled: $('musicEnabled').checked, autoParseCards: $('autoParseCards').checked, maxSeconds: Number($('maxSeconds').value), recommendTags: Number($('recommendTags').value) },
    mp4: { enabled: $('mp4Enabled').checked, maxDurationMinutes: Number($('maxDurationMinutes').value), sendAsFile: $('sendAsFile').checked },
    cache: { days: Number($('cacheDays').value), maxMb: Number($('cacheMaxMb').value) },
    tags: tags.map((t) => t.kw)
  };
  try { await api('/api/music/settings', { method: 'POST', body: JSON.stringify(payload) }); toast('保存了'); await load(); }
  catch (e) { toast('保存失败：' + e.message, false); }
});
load().catch((e) => toast('加载失败：' + e.message, false));
</script>
</body>
</html>
